# AVLite Community Plugins Registry
# This file serves as a registry for AVLite community plugins
# Each plugin entry should follow the structure below

plugins:
  - name: basic_predictor
    description: LSTM trajectory prediction plugin for AVLite
    repository: https://github.com/Murdism/basic_predictor
    version: latest
    author: Murdism
    category:
      - PredictionStrategy

  - name: World Bridge Carla
    description: A plugin that bridges Carla world to AVLite
    repository: https://github.com/AV-Lab/avlite-bridge-carla
    version: latest
    author: AV-Lab
    category:
      - WorldBridge

  - name: sample_avlite_plugin
    description: Sample AVLite plugin demonstrating the plugin interface
    repository: https://github.com/AV-Lab/sample-avlite-plugin
    version: latest
    author: AV-Lab
    category:
      - PerceptionStrategy
